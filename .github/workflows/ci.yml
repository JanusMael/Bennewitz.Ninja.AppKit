name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

# ⛔ Every family runs on every pull request, with no path filters (plans/00009 decision 14 in
# Bennewitz.Ninja.Templates): requiredChecks names these jobs, and a job a path filter skips never
# reports, which blocks every pull request indefinitely.
jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AppKit.slnx

      - name: Build
        run: dotnet build AppKit.slnx --no-restore -c Release --nologo -warnaserror

      # PackagingTests runs here: it reads the project files and the two package lists, so it
      # catches an unclassified packable project on the push that adds it rather than at release
      # time, when a mistake is already permanent.
      - name: Test
        run: dotnet test --solution AppKit.slnx --no-build -c Release

  # ⭐ Packing on every push, not only at release. The release workflow's pack step is the first
  # time packing runs there, so a packaging mistake would surface with a tag already pushed and
  # the version already spent. Here it is free.
  pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack AppKit.slnx -c Release --nologo --output ./packages/Release

      # The same guard the release runs, against the same artifacts, at no cost.
      - name: Assert packed matches declared
        run: dotnet run scripts/assert-packages.cs -- ./packages/Release

  # The family conventions: documentation at the root and in every top-level directory, the
  # description, topics, feature toggles and rulesets. See docs/repository-conventions.md in
  # Bennewitz.Ninja.Templates.
  #
  # ⚠ The job name is a required check in .github/repository.json. Renaming it means changing that
  # list and running `repo-conventions apply` in the same change, or every pull request blocks.
  conventions:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check the repository conventions
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --file scripts/repo-conventions.cs -- check

  # ⛔ The measurement behind AppServices.EntryPoint's IsAotCompatible (decisions 2 and 11 of
  # plans/00001): tests/EntryPointProbe published with native AOT, the library rooted whole and
  # warnings as errors, then the probe's contract run against the native binary. One job per platform,
  # since a native binary is built for its own. Both are required checks in .github/repository.json,
  # so a change that breaks the claim cannot merge.
  #
  # The test step names its project: --filter-class over the solution finds nothing in the other test
  # assemblies, and a test assembly that runs no test exits 8.
  aot-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Native AOT links with the platform's C toolchain.
      - name: Install the native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Build
        run: dotnet build tests/AppServices.Tests/AppServices.Tests.csproj -c Release --nologo -warnaserror

      - name: Publish the entry-point probe with native AOT
        run: dotnet publish tests/EntryPointProbe/EntryPointProbe.csproj -c Release -r linux-x64 -p:PublishAot=true -warnaserror --nologo -o artifacts/aot

      - name: Run the probe's contract against the native binary
        env:
          ENTRYPOINT_PROBE_NATIVE: ${{ github.workspace }}/artifacts/aot/EntryPointProbe
        run: dotnet test --project tests/AppServices.Tests/AppServices.Tests.csproj --no-build -c Release --filter-class AppServices.Tests.EntryPoint.EntryPointProbeTests

  aot-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build tests/AppServices.Tests/AppServices.Tests.csproj -c Release --nologo -warnaserror

      - name: Publish the entry-point probe with native AOT
        run: dotnet publish tests/EntryPointProbe/EntryPointProbe.csproj -c Release -r win-x64 -p:PublishAot=true -warnaserror --nologo -o artifacts/aot

      - name: Run the probe's contract against the native binary
        env:
          ENTRYPOINT_PROBE_NATIVE: ${{ github.workspace }}/artifacts/aot/EntryPointProbe.exe
        run: dotnet test --project tests/AppServices.Tests/AppServices.Tests.csproj --no-build -c Release --filter-class AppServices.Tests.EntryPoint.EntryPointProbeTests

  # ⭐ The only check that reads ScopedEditors' COMPILED XAML. Avalonia's XAML compiler weaves IL into
  # ScopedEditors.AvaloniaUI after Roslyn has finished, so the trim analyser that runs in `build`
  # never sees it. ILLink reads the finished assemblies, woven IL included. TrimCheck.csproj roots
  # every shipped assembly, and the warnings ILLink reports must match
  # trimcheck/expected-warnings.txt exactly, in both directions.
  trim:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # ⚠ `shell: bash` is what turns on pipefail. Left unspecified, the shell runs as `bash -e`,
      # so a publish that failed would pass this step through tee and leave the comparison an
      # empty log, which it fails too, but with the wrong message.
      - name: Publish trimmed
        shell: bash
        run: dotnet publish trimcheck/TrimCheck.csproj -c Release -r linux-x64 --nologo | tee trim-publish.log

      - name: Compare warnings with the baseline
        run: dotnet run scripts/check-trim-warnings.cs -- trim-publish.log trimcheck/expected-warnings.txt
